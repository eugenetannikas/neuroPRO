#list of analysis levels in the bids app
analysis_levels: &analysis_levels
 - participant
 - group

#mapping from analysis_level to set of target rules or files
targets_by_analysis_level:
  participant:
    - 'all_participant'
  group:
    - 'all_group'

# Inputs are discovered with custom planning-time logic in
# workflow/rules/common.smk: the T1w runs use mixed naming (with/without
# acq-) that pybids/snakebids cannot express as one path template, and the
# NM-GRE images live in sourcedata/ with non-BIDS names.
pybids_inputs: {}

#configuration for the command-line parameters to make available
# passed on the argparse add_argument()
parse_args:
  --nm_variant:
    help: "Which distortion-correction variant of the NM-GRE magnitude series to
      use. Siemens exports each acquisition twice: 'corrected' (SeriesDescription
      'NM-GRE') and 'uncorrected' ('NM-GRE_ND', i.e. no distortion correction).
      (default: %(default)s)"
    default: corrected
    choices:
      - corrected
      - uncorrected

  --nm_echoes:
    help: "Echo numbers to use for the NM image. Echoes of one acquisition are
      combined by plain averaging, never realigned to each other. The default
      is the first echo alone: it has the shortest TE, so the most signal and
      the least T2*-eroded neuromelanin contrast; later echoes add noise about
      as fast as signal. Pass e.g. '1 2 3' for an unregistered echo average.
      (default: %(default)s)"
    type: int
    nargs: '+'
    default: [1]

  --nm_layout:
    help: "Naming convention of the NM-GRE images. 'auto' tries each in turn
      and uses the first that matches: 'cfmm' (sourcedata/**/nm-gre/NM-GRE_s<s>_e<e>),
      'dcm2niix' (raw <series>_<desc>_e<echo>_<stamp> export), 'bids'
      (sub-X_acq-NM_echo-N_part-mag_MEGRE under anat/). (default: %(default)s)"
    default: auto
    choices:
      - auto
      - cfmm
      - dcm2niix
      - bids

  --nm_pattern:
    help: "Escape hatch for datasets none of the built-in layouts match: a glob
      for the NM magnitude images, relative to each subject directory (e.g.
      'nm/*_mag.nii.gz'). Overrides --nm_layout. (default: %(default)s)"
    default: null

  --include_combecho:
    help: "Include scanner-side combined-echo (CombEcho) series in the NM
      average. Off by default, since combining them with the individual echoes
      they are derived from double-counts that signal. (default: %(default)s)"
    action: store_true

  --t1w_strategy:
    help: "How to choose among multiple T1w runs of the preferred protocol.
      A recognised 3D T1 sequence (MPRAGE, MP2RAGE, BRAVO, FSPGR, TFE, ...) is
      preferred over an unrecognised one, and both over a distortion-uncorrected
      '_ND' export. 'last' picks the highest SeriesNumber (a re-scan is usually
      acquired because earlier runs were corrupted by motion), 'first' the
      lowest, 'sharpest' the run with the highest Laplacian-variance sharpness.
      When SeriesNumber is unavailable, 'last'/'first' fall back to the run-
      entity and then to sharpness. (default: %(default)s)"
    default: last
    choices:
      - last
      - first
      - sharpest

  --t1w_choices:
    help: "Optional TSV with columns 'subject' and 'filename' to manually
      override the T1w run used for specific subjects (filename as it appears
      in the subject's anat/ folder). (default: %(default)s)"
    default: null

  --out_res:
    help: "Isotropic voxel size (mm) of the normalized (template-space) outputs
      (default: %(default)s)"
    type: float
    default: 1.0

  --template_dir:
    help: "Directory containing the template files (T1w, brain mask, tissue
      probsegs). Defaults to the bundled tpl-MNI152NLin2009cAsym resources.
      (default: %(default)s)"
    default: null

  --template_name:
    help: "Name of the template (used in output space- entity and to build
      bundled resource filenames) (default: %(default)s)"
    default: MNI152NLin2009cAsym

singularity: {}
