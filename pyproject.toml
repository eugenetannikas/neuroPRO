[project]
authors = [{name = "Khan Lab"}]
name = "neuroPRO"
description = "Snakebids app for preprocessing neuromelanin-sensitive MRI (NM-MRI) for LC/SN segmentation"
requires-python = ">= 3.11"
version = "0.1.0"
scripts = { neuropro = "neuropro.run:app.run" }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["neuropro"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.feature.runtime.dependencies]
python = ">=3.11,<3.13"
snakemake = ">=9.5.1,<10"
snakebids = ">=0.15.0,<0.16"
snakemake-executor-plugin-slurm = ">=1.4.0,<2"
antspyx = ">=0.5.4"
nibabel = ">=5.3.2,<6"
numpy = ">=1.26"
scipy = ">=1.11.0,<2"
matplotlib = ">=3.7.0,<4"
pandas = ">=2.0"

[tool.pixi.pypi-dependencies]
neuroPRO = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
black = ">=24.0.0, <25.0.0"
snakefmt = ">=0.10.0, <0.11.0"
pytest = "*"

[tool.pixi.environments.default]
features = ["runtime"]

[tool.pixi.environments.dev]
features = ["runtime", "dev"]

[tool.pixi.tasks]
quality_fix = "black neuropro && snakefmt neuropro"
test = { cmd = "pytest", environment = "dev" }
